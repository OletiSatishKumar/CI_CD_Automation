name: Build and Deploy App

on:
  push:
    branches:
      - master  # or any other branch name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: List directory contents (for debugging)
      run: |
        ls -la

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Generate Docker image tag
      id: tag
      run: |
        TAG=$(date +'%Y%m%d%H%M%S')-${GITHUB_SHA::7}
        echo "tag=$TAG" >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/flowershop:${{ steps.tag.outputs.tag }} ./Flower-Web-App
        docker push ${{ secrets.DOCKER_USERNAME }}/flowershop:${{ steps.tag.outputs.tag }}

    - name: Trigger Infra Repo to update values.yaml
      run: |
        curl -X POST https://api.github.com/repos/${{ secrets.INFRA_REPO }}/dispatches \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: token ${{ secrets.GH_TOKEN }}" \
        -d '{"event_type":"update_infra","client_payload":{"tag":"'"${{ steps.tag.outputs.tag }}"'"}}'
