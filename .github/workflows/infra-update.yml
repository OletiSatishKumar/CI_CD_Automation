name: Infra Update

on:
  repository_dispatch:
    types: [update_infra]

jobs:
  update-infra:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Infra Repository
      uses: actions/checkout@v3
      with:
        repository: ${{ secrets.INFRA_REPO }}  # Ensure correct repository name
        token: ${{ secrets.GH_TOKEN }}         # Your GitHub token to access the repository

    - name: Debug Payload
      run: |
        echo "Payload: ${{ github.event.client_payload }}"

    - name: List files for debugging
      run: |
        ls -la infra/helm/flowershop

    - name: Update values.yaml with new tag
      run: |
        echo "Updating values.yaml with new tag: ${{ github.event.client_payload.tag }}"
        # Backup file before applying changes
        cp infra/helm/flowershop/values.yaml infra/helm/flowershop/values.yaml.bak
        # Apply sed and show result
        sed -i "s/tag: .*/tag: ${{ github.event.client_payload.tag }}/" infra/helm/flowershop/values.yaml
        echo "Before:"
        cat infra/helm/flowershop/values.yaml.bak
        echo "After:"
        cat infra/helm/flowershop/values.yaml

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add infra/helm/flowershop/values.yaml
        git commit -m "Update values.yaml with new tag ${{ github.event.client_payload.tag }}"
        git push origin master  # or any other branch you use for infra changes
